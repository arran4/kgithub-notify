name: Finish PR 290

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  finish:
    if: ${{ github.event.pull_request.number == 290 && github.head_ref == 'fix-261-276-credentials-capabilities-47735184781319218' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply final review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          client = Path("src/GitHubClient.cpp")
          text = client.read_text()

          include_marker = '#include <QUrlQuery>\n\n'
          helper = '''#include <QUrlQuery>\n\nnamespace {\nbool isRateLimitedReply(const QNetworkReply* reply) {\n    return reply->rawHeader("X-RateLimit-Remaining").trimmed() == "0" || reply->hasRawHeader("Retry-After");\n}\n}  // namespace\n\n'''
          if 'bool isRateLimitedReply(const QNetworkReply* reply)' not in text:
              if include_marker not in text:
                  raise SystemExit("GitHubClient include marker not found")
              text = text.replace(include_marker, helper, 1)

          old_rate = '(statusCode == 403 && !reply->hasRawHeader("X-RateLimit-Remaining"))'
          count = text.count(old_rate)
          if count != 2:
              raise SystemExit(f"expected 2 old rate-limit checks, found {count}")
          text = text.replace(old_rate, '(statusCode == 403 && !isRateLimitedReply(reply))')

          old_guidance = '''QString GitHubClient::getPermissionGuidance() {\n    return "Ensure your token has the correct scopes.\\n"\n           "For Classic Tokens: 'repo' and 'notifications'.\\n"\n           "For Fine-grained Tokens: Read-only for Metadata and Notifications, Read/Write for Issues and Pull "\n           "Requests.";\n}\n'''
          new_guidance = '''QString GitHubClient::getPermissionGuidance() {\n    return "Ensure your token has the correct permissions.\\n"\n           "For Classic Tokens: 'repo' is recommended for full functionality and already grants notification "\n           "access; 'notifications' is sufficient for notification-only access.\\n"\n           "For Fine-grained Tokens: Metadata (Read), plus Issues and Pull requests (Read/Write) as needed. "\n           "GitHub's REST notifications endpoints do not support fine-grained PATs.\\n"\n           "If Test Key reports Create Issues or PR Comments as Limited or No, update the token's write "\n           "permissions before using those actions.";\n}\n'''
          if old_guidance not in text:
              raise SystemExit("old permission guidance block not found")
          text = text.replace(old_guidance, new_guidance, 1)
          client.write_text(text)

          readme = Path("README.md")
          readme_text = readme.read_text()
          old_classic = "  - **Classic Token**: Requires `repo` and `notifications` scopes."
          new_classic = "  - **Classic Token**: `repo` is recommended for full functionality and already grants notification access; `notifications` is sufficient for notification-only access."
          if old_classic not in readme_text:
              raise SystemExit("README classic-token guidance not found")
          readme.write_text(readme_text.replace(old_classic, new_classic, 1))

          test_source = r'''#include <QFutureInterface>
#include <QLabel>
#include <QLineEdit>
#include <QPushButton>
#include <QSettings>
#include <QStandardPaths>
#include <QTemporaryDir>
#include <QtTest>

#include "../src/SettingsDialog.h"
#include "../src/WalletManager.h"

namespace {
QFuture<WalletResult> completedFuture(const WalletResult& result) {
    QFutureInterface<WalletResult> interface;
    interface.reportStarted();
    interface.reportResult(result);
    interface.reportFinished();
    return interface.future();
}

class MockWalletBackend : public WalletBackend {
   public:
    QFuture<WalletResult> loadTokenAsync() override {
        ++loadCalls;
        return completedFuture(loadResult);
    }

    QFuture<WalletResult> saveTokenAsync(const QString& token) override {
        ++saveCalls;
        savedToken = token;
        return completedFuture(saveResult);
    }

    QFuture<WalletResult> clearTokenAsync() override {
        ++clearCalls;
        return completedFuture(clearResult);
    }

    WalletResult loadResult{true, "", ""};
    WalletResult saveResult{true, "", ""};
    WalletResult clearResult{true, "", ""};
    QString savedToken;
    int loadCalls = 0;
    int saveCalls = 0;
    int clearCalls = 0;
};

QLineEdit* tokenEdit(SettingsDialog& dialog) {
    const auto edits = dialog.findChildren<QLineEdit*>();
    for (QLineEdit* edit : edits) {
        if (edit->echoMode() == QLineEdit::Password) return edit;
    }
    return nullptr;
}

QLabel* labelContaining(SettingsDialog& dialog, const QString& text) {
    const auto labels = dialog.findChildren<QLabel*>();
    for (QLabel* label : labels) {
        if (label->text().contains(text)) return label;
    }
    return nullptr;
}

void verifyTokenNotInQSettings(const QString& token) {
    QSettings settings;
    QVERIFY(!settings.contains("token"));
    for (const QString& key : settings.allKeys()) {
        QVERIFY2(settings.value(key).toString() != token, qPrintable("token leaked through QSettings key " + key));
    }
}
}  // namespace

class TestCredentialPersistence : public QObject {
    Q_OBJECT

   private slots:
    void initTestCase() {
        QVERIFY(storage.isValid());
        QStandardPaths::setTestModeEnabled(true);
        QSettings::setDefaultFormat(QSettings::IniFormat);
        QSettings::setPath(QSettings::IniFormat, QSettings::UserScope, storage.path());
        QCoreApplication::setOrganizationName("credential-persistence-tests");
        QCoreApplication::setApplicationName("credential-persistence-tests");
    }

    void init() { QSettings().clear(); }

    void cleanup() { WalletManager::setBackend(nullptr); }

    void loadFailureIsVisibleAndEditable() {
        MockWalletBackend backend;
        backend.loadResult = {false, "", "wallet locked"};
        WalletManager::setBackend(&backend);

        SettingsDialog dialog;
        QLineEdit* edit = tokenEdit(dialog);
        QVERIFY(edit);
        QTRY_VERIFY(edit->isEnabled());
        QCOMPARE(edit->text(), QString());
        QCOMPARE(edit->placeholderText(), QString("Enter token..."));
        QTRY_VERIFY(labelContaining(dialog, "Failed to load token from KWallet") != nullptr);
        QCOMPARE(backend.loadCalls, 1);
    }

    void saveFailurePreservesTokenAndRetryAccepts() {
        MockWalletBackend backend;
        backend.saveResult = {false, "", "write denied"};
        WalletManager::setBackend(&backend);

        SettingsDialog dialog;
        QLineEdit* edit = tokenEdit(dialog);
        QPushButton* save = dialog.findChild<QPushButton*>("saveButton");
        QVERIFY(edit);
        QVERIFY(save);
        QTRY_VERIFY(edit->isEnabled());

        edit->setText("new_token");
        QTest::mouseClick(save, Qt::LeftButton);

        QTRY_COMPARE(backend.saveCalls, 1);
        QTRY_VERIFY(save->isEnabled());
        QVERIFY(dialog.result() != QDialog::Accepted);
        QCOMPARE(edit->text(), QString("new_token"));
        QTRY_VERIFY(labelContaining(dialog, "Failed to save token to KWallet") != nullptr);
        verifyTokenNotInQSettings("new_token");

        backend.saveResult = {true, "", ""};
        QTest::mouseClick(save, Qt::LeftButton);
        QTRY_COMPARE(backend.saveCalls, 2);
        QTRY_COMPARE(dialog.result(), int(QDialog::Accepted));
        QCOMPARE(backend.savedToken, QString("new_token"));
        verifyTokenNotInQSettings("new_token");
    }

    void clearFailureKeepsDialogOpenAndRetryAccepts() {
        MockWalletBackend backend;
        backend.loadResult = {true, "old_token", ""};
        backend.clearResult = {false, "", "remove denied"};
        WalletManager::setBackend(&backend);

        SettingsDialog dialog;
        QLineEdit* edit = tokenEdit(dialog);
        QPushButton* save = dialog.findChild<QPushButton*>("saveButton");
        QVERIFY(edit);
        QVERIFY(save);
        QTRY_COMPARE(edit->text(), QString("old_token"));

        edit->clear();
        QTest::mouseClick(save, Qt::LeftButton);
        QTRY_COMPARE(backend.clearCalls, 1);
        QTRY_VERIFY(save->isEnabled());
        QVERIFY(dialog.result() != QDialog::Accepted);
        QCOMPARE(edit->text(), QString());
        QTRY_VERIFY(labelContaining(dialog, "Failed to save token to KWallet") != nullptr);

        backend.clearResult = {true, "", ""};
        QTest::mouseClick(save, Qt::LeftButton);
        QTRY_COMPARE(backend.clearCalls, 2);
        QTRY_COMPARE(dialog.result(), int(QDialog::Accepted));
    }

   private:
    QTemporaryDir storage;
};

QTEST_MAIN(TestCredentialPersistence)
#include "TestCredentialPersistence.moc"
'''
          Path("tests/TestCredentialPersistence.cpp").write_text(test_source)

          cmake = Path("CMakeLists.txt")
          cmake_text = cmake.read_text()
          marker = '''set_tests_properties(TestRequestConsumers PROPERTIES ENVIRONMENT "QT_QPA_PLATFORM=offscreen")\n'''
          addition = '''set_tests_properties(TestRequestConsumers PROPERTIES ENVIRONMENT "QT_QPA_PLATFORM=offscreen")\n\nadd_executable(TestCredentialPersistence tests/TestCredentialPersistence.cpp ${consumer_sources})\ntarget_link_libraries(TestCredentialPersistence PRIVATE ${consumer_libraries} Qt6::Test)\nadd_test(NAME TestCredentialPersistence COMMAND TestCredentialPersistence)\nset_tests_properties(TestCredentialPersistence PROPERTIES ENVIRONMENT "QT_QPA_PLATFORM=offscreen")\n'''
          if 'add_executable(TestCredentialPersistence' not in cmake_text:
              if marker not in cmake_text:
                  raise SystemExit("CMake TestRequestConsumers marker not found")
              cmake.write_text(cmake_text.replace(marker, addition, 1))

          Path(".github/workflows/finish-pr-290.yml").unlink()
          PY

          git diff --check
          git status --short

      - name: Commit final fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finish credential and capability review"
          git push origin "HEAD:${{ github.head_ref }}"
